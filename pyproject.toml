[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oge-cropland-seg"
version = "0.1.0"
description = "SegFormer-B5 baseline for OGE cropland segmentation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.6.0", "transformers==4.51.3", "numpy==2.2.6",
  "rasterio==1.4.3", "PyYAML==6.0.2", "tensorboard==2.19.0",
  "Pillow==11.2.1", "tqdm==4.67.1", "safetensors>=0.4.3,<1",
  "huggingface-hub>=0.30,<1", "setuptools==80.9.0"
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
include = ["cropland*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
